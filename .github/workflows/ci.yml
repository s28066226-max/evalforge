name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to evaluate (comma-separated)"
        default: "groq:openai/gpt-oss-20b,groq:qwen/qwen3.8-27b"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Eval regression gate (mock mode)
        run: npm run eval -- --mock --fail-on-regression

  # Real evaluation on free-tier models. Manual only, so pushes never use up your daily quota.
  eval:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Evaluate
        run: npm run eval -- --models "${{ inputs.models }}" --fail-on-regression | tee eval-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            eval-report.txt
            data/evalforge.db
